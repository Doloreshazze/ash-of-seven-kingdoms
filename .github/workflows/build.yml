name: Godot CI — Validate and Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import game assets
        run: |
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/godot-import.log; then exit 1; fi
      - name: Parse and run first frames (smoke test)
        run: |
          timeout 60s godot --headless --path . --verbose --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-smoke.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/godot-smoke.log; then exit 1; fi
      - name: Export Windows demo
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/AshOfSevenKingdoms.exe"
      - name: Publish Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ash-of-the-Seven-Kingdoms-Windows
          path: |
            build/AshOfSevenKingdoms.exe
            build/AshOfSevenKingdoms.pck
          if-no-files-found: error
          retention-days: 14

  character-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import painted character
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/character-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/character-import.log; then exit 1; fi
      - name: Check animation transitions and game events
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/character_smoke.gd 2>&1 | tee /tmp/character-check.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/character-check.log; then exit 1; fi
      - name: Prepare video encoder and software display
        run: |
          command -v xvfb-run
          python3 -m pip install --quiet --target "$RUNNER_TEMP/character-video" imageio-ffmpeg==0.8.1
          encoder="$(PYTHONPATH="$RUNNER_TEMP/character-video" python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "CHARACTER_FFMPEG=$encoder" >> "$GITHUB_ENV"
      - name: Render character review
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout 90s xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/character_review.gd 2>&1 | tee /tmp/character-render.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/character-render.log; then exit 1; fi
      - name: Encode motion preview
        run: |
          "$CHARACTER_FFMPEG" -y -v error -framerate 24 -i build/hero-motion/frame-%03d.png -c:v libx264 -pix_fmt yuv420p -crf 22 -movflags +faststart build/Flamewarden-motion.mp4
          python3 - <<'PY'
          import base64
          from pathlib import Path
          encoded = base64.b64encode(Path('build/Flamewarden-motion.mp4').read_bytes()).decode('ascii')
          for offset in range(0, len(encoded), 6000):
              print('CHARACTER_MOTION:' + encoded[offset:offset + 6000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Flamewarden-character-review
          path: |
            build/Flamewarden-review.png
            build/Flamewarden-motion.mp4
          if-no-files-found: error
          retention-days: 14



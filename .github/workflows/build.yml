name: Godot CI — Validate and Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import game assets
        run: |
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/godot-import.log; then exit 1; fi
      - name: Parse and run first frames (smoke test)
        run: |
          timeout 60s godot --headless --path . --verbose --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-smoke.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/godot-smoke.log; then exit 1; fi
      - name: Export Windows demo
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/AshOfSevenKingdoms.exe"
      - name: Publish Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ash-of-the-Seven-Kingdoms-Windows
          path: |
            build/AshOfSevenKingdoms.exe
            build/AshOfSevenKingdoms.pck
          if-no-files-found: error
          retention-days: 14

  character-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import painted character
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/character-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/character-import.log; then exit 1; fi
      - name: Check animation transitions and game events
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/character_smoke.gd 2>&1 | tee /tmp/character-check.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/character-check.log; then exit 1; fi
      - name: Install software display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Render character review
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout 90s xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/character_review.gd 2>&1 | tee /tmp/character-render.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/character-render.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Flamewarden-character-review
          path: build/Flamewarden-review.png
          if-no-files-found: error
          retention-days: 14



name: Import Godot project
on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Temporary download URL for the project ZIP
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import source archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, urllib.parse, urllib.request, zipfile
          url = os.environ["ARCHIVE_URL"]
          print("::add-mask::" + url)
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname.endswith(".oaiusercontent.com"):
              raise SystemExit("Expected the authorized project download host")
          with urllib.request.urlopen(url, timeout=120) as response:
              data = response.read(50 * 1024 * 1024 + 1)
          if len(data) != 4618429:
              raise SystemExit("Unexpected project archive size")
          print("Archive SHA256:", hashlib.sha256(data).hexdigest())
          archive = zipfile.ZipFile(io.BytesIO(data))
          projects = [pathlib.PurePosixPath(n) for n in archive.namelist() if n.endswith("project.godot")]
          if len(projects) != 1:
              raise SystemExit("Expected one Godot project")
          root = projects[0].parent
          target = pathlib.Path.cwd().resolve()
          for entry in archive.infolist():
              name = pathlib.PurePosixPath(entry.filename)
              if name.is_absolute() or ".." in name.parts or "\\" in entry.filename:
                  raise SystemExit("Unsafe archive path")
              try:
                  relative = name.relative_to(root)
              except ValueError:
                  continue
              if entry.is_dir():
                  continue
              if any(p in {".git", ".godot", "node_modules"} for p in relative.parts):
                  continue
              if relative.name in {".env", "local.properties"} or relative.suffix.lower() in {".jks", ".keystore", ".pem", ".key"}:
                  raise SystemExit("Unexpected private configuration in project")
              content = archive.read(entry)
              print("FILE", relative.as_posix(), len(content))
              if relative.parts[:2] == (".github", "workflows"):
                  print("--- Bundled workflow ---")
                  print(content.decode("utf-8"))
                  continue
              destination = target.joinpath(*relative.parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)
              if relative.as_posix() in {"project.godot", "export_presets.cfg"} or relative.suffix in {".sh", ".py"}:
                  print("--- Configuration", relative.as_posix(), "---")
                  print(content.decode("utf-8"))
          PY
      - name: Commit project source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Import Ash of Seven Kingdoms Godot project"
          git push origin HEAD:main
